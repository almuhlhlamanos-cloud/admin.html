<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Next Trade - منصة الاستثمار والتداول الحقيقية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            background-color: #0b0e14;
            color: #e2e8f0;
            font-family: system-ui, -apple-system, sans-serif;
        }
        .gold-bg {
            background: linear-gradient(135deg, #d4af37 0%, #f3e5ab 50%, #aa7c11 100%);
        }
        .gold-text {
            background: linear-gradient(135deg, #d4af37 0%, #f3e5ab 50%, #aa7c11 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .card-bg {
            background-color: #151d2a;
            border: 1px solid #232d3f;
        }
    </style>
</head>
<body class="pb-24">

    <!-- الترويسة العليا -->
    <header class="p-4 card-bg border-b border-gray-800 flex justify-between items-center sticky top-0 z-50">
        <div class="flex items-center space-x-2 space-x-reverse">
            <span class="text-2xl">🐂</span>
            <h1 class="text-xl font-bold gold-text">Next Trade</h1>
        </div>
        <div id="user-status" class="text-sm text-gray-400">غير مسجل</div>
    </header>

    <main class="p-4 max-w-md mx-auto">

        <!-- تنبيهات Toast -->
        <div id="custom-toast" class="hidden fixed top-16 left-1/2 transform -translate-x-1/2 card-bg p-3 rounded-lg border border-yellow-500/50 text-center shadow-lg z-50 w-11/12 max-w-sm">
            <span id="toast-icon">✅</span>
            <span id="toast-message" class="mr-2 text-sm"></span>
        </div>

        <!-- قسم تسجيل الدخول / حساب جديد -->
        <section id="page-auth" class="space-y-4">
            <div class="flex border-b border-gray-700 mb-4">
                <button onclick="switchAuthTab('login')" id="tab-login" class="w-1/2 py-2 font-bold border-b-2 border-yellow-500 gold-text">تسجيل الدخول</button>
                <button onclick="switchAuthTab('register')" id="tab-register" class="w-1/2 py-2 text-gray-400">حساب جديد</button>
            </div>

            <!-- نموذج تسجيل الدخول -->
            <form id="form-login" onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-xs text-gray-400 mb-1">البريد الإلكتروني</label>
                    <input id="login-email" type="email" required class="w-full p-3 rounded-xl bg-gray-900 border border-gray-700 text-white focus:outline-none focus:border-yellow-500">
                </div>
                <div>
                    <label class="block text-xs text-gray-400 mb-1">كلمة السر</label>
                    <input id="login-pass" type="password" required class="w-full p-3 rounded-xl bg-gray-900 border border-gray-700 text-white focus:outline-none focus:border-yellow-500">
                </div>
                <button type="submit" class="w-full py-3 gold-bg text-black font-bold rounded-xl shadow-lg">دخول</button>
            </form>

            <!-- نموذج حساب جديد -->
            <form id="form-register" onsubmit="handleRegister(event)" class="space-y-4 hidden">
                <div>
                    <label class="block text-xs text-gray-400 mb-1">الاسم الكامل</label>
                    <input id="reg-name" type="text" required class="w-full p-3 rounded-xl bg-gray-900 border border-gray-700 text-white focus:outline-none focus:border-yellow-500">
                </div>
                <div>
                    <label class="block text-xs text-gray-400 mb-1">البريد الإلكتروني</label>
                    <input id="reg-email" type="email" required class="w-full p-3 rounded-xl bg-gray-900 border border-gray-700 text-white focus:outline-none focus:border-yellow-500">
                </div>
                <div>
                    <label class="block text-xs text-gray-400 mb-1">كلمة السر</label>
                    <input id="reg-pass" type="password" required class="w-full p-3 rounded-xl bg-gray-900 border border-gray-700 text-white focus:outline-none focus:border-yellow-500">
                </div>
                <div>
                    <label class="block text-xs text-gray-400 mb-1">تأكيد كلمة السر</label>
                    <input id="reg-confirm-pass" type="password" required class="w-full p-3 rounded-xl bg-gray-900 border border-gray-700 text-white focus:outline-none focus:border-yellow-500">
                </div>
                <button type="submit" class="w-full py-3 gold-bg text-black font-bold rounded-xl shadow-lg">تأكيد الحساب والاشتراك</button>
            </form>
        </section>

        <!-- الرئيسية (بعد الدخول) -->
        <section id="page-home" class="hidden space-y-4">
            <div class="card-bg p-5 rounded-2xl">
                <div class="text-xs text-gray-400">الرصيد الكلي</div>
                <div id="user-balance" class="text-3xl font-bold gold-text my-1">$0.00</div>
                <div class="flex space-x-2 space-x-reverse mt-4">
                    <button onclick="showPage('deposit')" class="flex-1 py-2 gold-bg text-black font-bold rounded-lg text-sm">إيداع</button>
                    <button onclick="showPage('withdraw')" class="flex-1 py-2 bg-gray-800 text-white font-bold rounded-lg text-sm border border-gray-700">سحب</button>
                </div>
            </div>
        </section>

        <!-- سوق التداول -->
        <section id="page-trade" class="hidden space-y-4">
            <h3 class="font-bold text-lg gold-text">السوق الحي (BTC/USDT)</h3>
            <div class="card-bg p-2 rounded-2xl h-80">
                <!-- TradingView Chart Widget -->
                <iframe src="https://s.tradingview.com/widgetembed/?frameElementId=tradingview_1&symbol=BINANCE%3ABTCUSDT&interval=D&hidesidetoolbar=1&symboledit=1&saveimage=1&toolbarbg=f1f3f6&studies=[]&theme=dark&style=1&timezone=Etc%2FUTC" class="w-full h-full rounded-xl border-0"></iframe>
            </div>
        </section>

        <!-- الإيداع -->
        <section id="page-deposit" class="hidden space-y-4">
