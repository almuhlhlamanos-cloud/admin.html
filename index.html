<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة التداول والاستثمار</title>
    <!-- Tailwind CSS للتصميم -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0b0e14; color: #f3f4f6; font-family: sans-serif; }
        .gold-bg { background: linear-gradient(135deg, #bf953f, #fcf6ba, #b38728, #fbf5b7); }
        .gold-text { background: linear-gradient(135deg, #bf953f, #fcf6ba, #b38728); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .gold-border { border-color: #d4af37; }
    </style>
</head>
<body class="p-4 max-w-md mx-auto min-h-screen flex flex-col justify-between">

    <!-- الهيدر ورصيد المحفظة -->
    <div>
        <div class="flex justify-between items-center mb-6">
            <div>
                <h1 class="text-xl font-bold gold-text">الملك للتداول 🪙</h1>
                <p class="text-xs text-gray-400">مرحباً بك في منصتك الاستثمارية</p>
            </div>
            <div class="w-10 h-10 rounded-full border border-yellow-500 flex items-center justify-center bg-gray-900">
                <span class="text-yellow-500 font-bold">👤</span>
            </div>
        </div>

        <!-- كارت المحفظة -->
        <div class="p-5 rounded-2xl bg-gradient-to-r from-gray-900 via-gray-800 to-gray-900 border border-yellow-600/30 shadow-lg mb-6">
            <p class="text-xs text-gray-400 mb-1">إجمالي رصيد المحفظة</p>
            <h2 class="text-3xl font-extrabold text-white mb-3">$12,450.00 <span class="text-xs text-green-400 font-normal">+4.2%</span></h2>
            <div class="flex gap-3">
                <button class="flex-1 py-2 rounded-xl font-bold text-black gold-bg hover:opacity-90 transition">إيداع</button>
                <button class="flex-1 py-2 rounded-xl font-bold text-white bg-gray-800 border border-gray-700 hover:bg-gray-700 transition">سحب</button>
            </div>
        </div>

        <!-- الشارت الحي للأسواق (الشموع اليابانية) -->
        <div class="mb-6">
            <h3 class="text-sm font-bold text-gray-300 mb-2">حركة السوق المباشرة (BTC/USDT)</h3>
            <div class="w-full h-64 rounded-xl overflow-hidden border border-gray-800">
                <!-- شارت TradingView مجاني وحي -->
                <iframe src="https://s.tradingview.com/widgetembed/?frameElementId=tradingview_1&symbol=BINANCE%3ABTCUSDT&interval=D&hidesidetoolbar=1&symboledit=1&saveimage=1&toolbarbg=f1f3f6&studies=[]&theme=dark&style=1&timezone=Etc%2FUTC" 
                        class="w-full h-full border-0"></iframe>
            </div>
        </div>

        <!-- أزرار التداول السريع -->
        <div class="grid grid-cols-2 gap-4 mb-6">
            <button class="py-3 bg-green-600 hover:bg-green-500 text-white font-bold rounded-xl shadow-lg transition">شراء (Long)</button>
            <button class="py-3 bg-red-600 hover:bg-red-500 text-white font-bold rounded-xl shadow-lg transition">بيع (Short)</button>
        </div>
    </div>

    <!-- القائمة السفلى -->
    <div class="flex justify-around items-center bg-gray-900 py-3 rounded-2xl border border-gray-800 text-xs">
        <button class="text-yellow-500 font-bold flex flex-col items-center">📊 <span>السوق</span></button>
        <button class="text-gray-400 flex flex-col items-center">💼 <span>المحفظة</span></button>
        <button class="text-gray-400 flex flex-col items-center">⚙️ <span>الإعدادات</span></button>
    </div>

</body>
</html>
