<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة إدارية مباشرة أونلاين - NextTrade Admin</title>
    <!-- Firebase Realtime Database SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

    <style>
        :root {
            --bg-color: #0b1120;
            --card-bg: #1e293b;
            --accent-color: #00c853;
            --danger-color: #ef4444;
            --text-color: #f8fafc;
            --border-color: #334155;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); padding: 20px; }

        .admin-card {
            background-color: var(--card-bg); padding: 20px; border-radius: 10px; border: 1px solid var(--border-color); margin-bottom: 20px;
        }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13px; }
        th, td { border: 1px solid var(--border-color); padding: 10px; text-align: right; }
        th { background-color: #0f172a; color: #94a3b8; }

        .btn-approve { background-color: var(--accent-color); color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .btn-reject { background-color: var(--danger-color); color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; margin-right: 5px; }

        .input-box { width: 100%; padding: 10px; margin-top: 5px; margin-bottom: 15px; border-radius: 6px; border: 1px solid var(--border-color); background: #0f172a; color: white; }
        .hidden { display: none; }
        .badge { background-color: var(--accent-color); color: black; padding: 2px 6px; border-radius: 10px; font-size: 11px; font-weight: bold; }
    </style>
</head>
<body>

<h2 style="margin-bottom: 20px;">لوحة تحكم إدارية أونلاين - NextTrade <span class="badge">مباشر متصل</span></h2>

<!-- تسجيل دخول الأدمن -->
<div id="adminLogin" class="admin-card" style="max-width: 400px; margin: 50px auto;">
    <h3>دخول الإدارة</h3>
    <p style="font-size: 12px; color: #94a3b8; margin-bottom: 15px;">رمز الدخول المباشر: admin123</p>
    <input type="password" id="adminPass" class="input-box" placeholder="كلمة المرور">
    <button class="btn-approve" style="width: 100%; padding: 10px;" onclick="checkAdmin()">دخول</button>
</div>

<!-- المحتوى الرئيسي للوحة الأدمن -->
<div id="adminContent" class="hidden">

    <!-- الإيداعات المعلقة -->
    <div class="admin-card">
        <h3 style="color: var(--accent-color);">طلبات الإيداع والشحن المعلقة (USDT)</h3>
        <table>
            <thead>
                <tr>
                    <th>المستخدم</th>
                    <th>المبلغ ($)</th>
                    <th>رقم المعاملة (TxHash)</th>
                    <th>التاريخ</th>
                    <th>الإجراء (قبول حقيقي/رفض)</th>
                </tr>
            </thead>
            <tbody id="depositsTable"></tbody>
        </table>
    </div>

    <!-- السحوبات المعلقة -->
    <div class="admin-card">
        <h3 style="color: #38bdf8;">طلبات السحب المعلقة</h3>
        <table>
            <thead>
                <tr>
                    <th>المستخدم</th>
                    <th>المبلغ الإجمالي</th>
                    <th>الصافي للتحويل</th>
                    <th>عنوان المحفظة</th>
                    <th>التاريخ</th>
                    <th>الإجراء</th>
                </tr>
            </thead>
            <tbody id="withdrawalsTable"></tbody>
        </table>
    </div>

</div>

<script>
    // إعدادات خادم Firebase للربط المباشر
    const firebaseConfig = {
        databaseURL: "https://nexttrade-live-default-rtdb.firebaseio.com/"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    function checkAdmin() {
        const pass = document.getElementById('adminPass').value;
        if (pass === 'admin123') {
            document.getElementById('adminLogin').classList.add('hidden');
            document.getElementById('adminContent').classList.remove('hidden');
            listenToLiveUpdates();
        } else {
            alert('كلمة المرور غير صحيحة!');
        }
    }

    function listenToLiveUpdates() {
        // الاستماع الفوري لطلبات الإيداع عبر الإنترنت
        db.ref('deposits').on('value', (snapshot) => {
            const depTable = document.getElementById('depositsTable');
            depTable.innerHTML = '';

            if (snapshot.exists()) {
                const deposits = snapshot.val();
                Object.keys(deposits).forEach(key => {
                    const d = deposits[key];
                    if (d.status === 'معلق') {
                        depTable.innerHTML += `
                            <tr>
                                <td>${d.userEmail}</td>
                                <td><b>$${d.amount}</b></td>
                                <td style="font-family:monospace; font-size:11px;">${d.txHash}</td>
                                <td>${d.date}</td>
                                <td>
                                    <button class="btn-approve" onclick="approveDeposit('${key}', '${d.userKey}', ${d.amount})">قبول وإضافة للحساب فوراً</button>
                                    <button class="btn-reject" onclick="rejectDeposit('${key}')">رفض</button>
                                </td>
                            </tr>
                        `;
                    }
                });
            }
            if(depTable.innerHTML === '') {
                depTable.innerHTML = '<tr><td colspan="5" style="text-align:center; color:#94a3b8;">لا توجد طلبات إيداع معلقة حالياً</td></tr>';
            }
        });

        // الاستماع الفوري لطلبات السحب عبر الإنترنت
        db.ref('withdrawals').on('value', (snapshot) => {
            const withTable = document.getElementById('withdrawalsTable');
            withTable.innerHTML = '';

            if (snapshot.exists()) {
                const withdrawals = snapshot.val();
                Object.keys(withdrawals).forEach(key => {
                    const w = withdrawals[key];
                    if (w.status === 'معلق') {
                        withTable.innerHTML += `
                            <tr>
                                <td>${w.userEmail}</td>
                                <td>$${w.amount}</td>
                                <td><b>$${w.net}</b></td>
                                <td style="font-family:monospace; font-size:11px;">${w.address}</td>
                                <td>${w.date}</td>
                                <td>
                                    <button class="btn-approve" onclick="approveWithdraw('${key}')">تم التحويل للمحفظة</button>
                                    <button class="btn-reject" onclick="rejectWithdraw('${key}', '${w.userKey}', ${w.amount})">إلغاء وإعادة المبلغ</button>
                                </td>
                            </tr>
                        `;
                    }
                });
            }
            if(withTable.innerHTML === '') {
                withTable.innerHTML = '<tr><td colspan="6" style="text-align:center; color:#94a3b8;">لا توجد طلبات سحب معلقة حالياً</td></tr>';
            }
        });
    }

    function approveDeposit(depId, userKey, amount) {
        // تحديث حالة الطلب
        db.ref('deposits/' + depId).update({ status: 'مقبول' }).then(() => {
            // زيادة رصيد الاستثمار للمستخدم في قواعد البيانات مباشرة
            db.ref('users/' + userKey + '/invested').transaction((currentInvested) => {
                return (parseFloat(currentInvested) || 0) + parseFloat(amount);
            }).then(() => {
                alert('تم القبول بنجاح! نزل رصيد الاستثمار في حساب المستخدم فوراً أونلاين.');
            });
        });
    }

    function rejectDeposit(depId) {
        db.ref('deposits/' + depId).update({ status: 'مرفوض' }).then(() => {
            alert('تم رفض طلب الإيداع.');
        });
    }

    function approveWithdraw(withdrawId) {
        db.ref('withdrawals/' + withdrawId).update({ status: 'مكتمل' }).then(() => {
            alert('تم تأكيد السحب بنجاح.');
        });
    }

    function rejectWithdraw(withdrawId, userKey, amount) {
        db.ref('withdrawals/' + withdrawId).update({ status: 'مرفوض' }).then(() => {
            // إعادة الرصيد للمستخدم
            db.ref('users/' + userKey + '/withdrawable').transaction((currentWithdrawable) => {
                return (parseFloat(currentWithdrawable) || 0) + parseFloat(amount);
            }).then(() => {
                alert('تم إلغاء طلب السحب وإعادة المبلغ إلى حساب المستخدم.');
            });
        });
    }
</script>
</body>
        </html>
